# Тег vX.Y.Z → тесты Core (Kotlin), сборка APK, релиз с APK и веб-версией.
# Подпись: Secrets репо SIGNING_KEYSTORE_B64 / SIGNING_STORE_PASSWORD / SIGNING_KEY_ALIAS / SIGNING_KEY_PASSWORD
# (кладёт tools/signing-setup.sh) → тот же постоянный ключ, что на маке; нет секретов — debug-ключ раннера.
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      # Android SDK уже есть в образе раннера; android-actions/setup-android@v3 на Ubuntu 26 падает (ищет удалённый пакет 'tools')
      - name: Android SDK — лицензии и платформа 36
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "sdkmanager: $SM"
          yes | "$SM" --licenses >/dev/null || true
          "$SM" --install "platforms;android-36" | tail -2
      - uses: gradle/actions/setup-gradle@v4
      - name: Версия из тега = versionName
        id: ver
        run: |
          VER=$(grep -m1 'versionName' android/app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          TAG="${GITHUB_REF_NAME#v}"
          echo "versionName=$VER, тег=$GITHUB_REF_NAME"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$TAG" != "$VER" ]; then echo "::error::Тег $GITHUB_REF_NAME не совпадает с versionName $VER"; exit 1; fi
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
      - name: Тесты веба (node test.js)
        run: cd web && node test.js
      - name: Ключ подписи из Secrets
        env:
          KS_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/qdebit.jks"
            {
              echo "QDEBIT_KEYSTORE=$RUNNER_TEMP/qdebit.jks"
              echo "QDEBIT_KEYSTORE_PASSWORD=$KS_PASS"
              echo "QDEBIT_KEY_ALIAS=${KEY_ALIAS:-qdebit}"
              echo "QDEBIT_KEY_PASSWORD=${KEY_PASS:-$KS_PASS}"
            } >> "$GITHUB_ENV"
            echo "Постоянный ключ из Secrets"
          else
            echo "::warning::Секретов подписи нет — APK с debug-ключом раннера (каждый релиз — новый ключ)"
          fi
      - name: Тесты Core и сборка APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --console=plain testDebugUnitTest assembleDebug
      - name: Проверка подписи, файлы релиза
        run: |
          V=${{ steps.ver.outputs.ver }}
          cp android/app/build/outputs/apk/debug/app-debug.apk "QDebit-$V.apk"
          cp web/QDebit.html "QDebit-$V.html"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "QDebit-$V.apk" | grep -E "DN|SHA-256" | tee cert.txt
          rm -f "$RUNNER_TEMP/qdebit.jks"
      - name: Релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${{ steps.ver.outputs.ver }}
          T="${GITHUB_REF_NAME}"; [ "$GITHUB_REF_TYPE" = tag ] || T="v$V"
          FP=$(grep -m1 "SHA-256" cert.txt | sed 's/.*: //')
          NOTES="Android: QDebit-$V.apk (Android 8+), подпись SHA-256: $FP. Веб: QDebit-$V.html — открыть в браузере, данные хранятся в браузере. Онлайн: https://q00000p.github.io/QDebit/"
          if gh release view "$T" >/dev/null 2>&1; then
            gh release upload "$T" "QDebit-$V.apk" "QDebit-$V.html" --clobber
          else
            gh release create "$T" "QDebit-$V.apk" "QDebit-$V.html" --title "QDebit $V" --notes "$NOTES" --generate-notes
          fi
