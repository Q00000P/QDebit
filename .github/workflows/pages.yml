# Веб-версия на GitHub Pages: собранный web/QDebit.html → https://q00000p.github.io/QDebit/
name: Pages
on:
  push:
    branches: [main]
    paths: ["web/QDebit.html", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Проверка формул (node test.js)
        run: cd web && node test.js
      - name: Сайт из одного файла
        run: |
          mkdir -p _site
          cp web/QDebit.html _site/index.html
          cp icon/qdebit-512.png _site/icon.png
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: dep
        uses: actions/deploy-pages@v4
